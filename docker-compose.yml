services:
  postfach:
    build: .
    image: schulpostfach:latest
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Bitte SECRET_KEY in der Datei .env setzen}
      HTTPS: ${HTTPS:-0}
    ports:
      - "${BIND:-127.0.0.1}:8000:8000"
    volumes:
      - postfach-data:/data:Z
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  postfach-data:
